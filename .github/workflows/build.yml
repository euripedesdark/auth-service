name: Build and Test
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: iam_smoke
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: iam_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iam_smoke -d iam_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B clean verify
        env:
          IAM_TEST_DB_URL: jdbc:postgresql://localhost:5432/iam_smoke?sslmode=disable
