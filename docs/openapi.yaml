openapi: 3.0.3
info:
  title: Auth Service API
  version: 1.0.0
  description: Identity authentication service
paths:
  /api/v1/identity/me:
    get:
      security: [{basicAuth: []}]
      responses:
        "200":
          description: Authenticated identity
          content: {application/json: {schema: {$ref: "#/components/schemas/Identity"}}}
        "401": {description: Unauthenticated or invalid credentials}
        "403": {description: Access denied}
        "503": {description: Authentication provider unavailable}
  /api/v1/identity/groups:
    get:
      security: [{basicAuth: []}]
      responses:
        "200":
          description: Authenticated identity with AD groups
          content: {application/json: {schema: {$ref: "#/components/schemas/Identity"}}}
        "401": {description: Unauthenticated or invalid credentials}
        "403": {description: Access denied}
        "503": {description: Authentication provider unavailable}
  /api/v1/identity/provider:
    get:
      security: [{basicAuth: []}]
      responses:
        "200":
          description: Authenticated identity with provider
          content: {application/json: {schema: {$ref: "#/components/schemas/Identity"}}}
        "401": {description: Unauthenticated or invalid credentials}
        "403": {description: Access denied}
        "503": {description: Authentication provider unavailable}
  /api/v1/identity/authenticated:
    get:
      security: [{basicAuth: []}]
      responses:
        "200":
          description: Authenticated identity
          content: {application/json: {schema: {$ref: "#/components/schemas/Identity"}}}
        "401": {description: Unauthenticated or invalid credentials}
        "403": {description: Access denied}
        "503": {description: Authentication provider unavailable}
  /api/v1/identity/authenticate:
    post:
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/LoginRequest"}}}
      responses:
        "200":
          description: Authenticated identity
          content: {application/json: {schema: {$ref: "#/components/schemas/Identity"}}}
        "401": {description: Invalid credentials}
        "503": {description: Authentication provider unavailable}
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    Identity:
      type: object
      required: [identityId, username, provider, groups]
      properties:
        identityId: {type: string}
        username: {type: string}
        provider: {type: string}
        groups:
          type: array
          items: {type: string}
    LoginRequest:
      type: object
      required: [username, password, provider]
      properties:
        username: {type: string}
        password: {type: string, format: password}
        provider: {type: string}
